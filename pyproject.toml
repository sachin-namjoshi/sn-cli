[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sn-cli"
version = "0.1.0"
description = "sn-cli — a command-line tool for ServiceNow. Query tables, manage widgets, and more (stdlib-only, zero deps)."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
snow = "sn_cli.cli:main"

[tool.setuptools]
packages = ["sn_cli", "sn_cli.commands"]
